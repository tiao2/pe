name: Build APK with WASM

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Compile Phy-Engine to WASM
        run: |
          cd phy_engine_src
          mkdir -p build_wasm && cd build_wasm
          SRC_FILES=$(find ../src -name "*.cpp" ! -path "*/fuzz/*" ! -path "*/benchmark/*")
          # 包装函数（需要根据实际引擎修改，目前为占位符）
          cat > sim_wrapper.cpp << EOC
          #include <string>
          #include <cstring>
          extern "C" const char* simulate_verilog(const char* code) {
              static std::string result = "Simulated: ";
              result += code;
              return result.c_str();
          }
EOC
          emcc -std=c++20 -O2 $SRC_FILES sim_wrapper.cpp -I../include \
            -s WASM=1 -s EXPORTED_FUNCTIONS='["_simulate_verilog","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' -s ALLOW_MEMORY_GROWTH=1 -o simulator.js
          cp simulator.js simulator.wasm ../../app/src/main/assets/
          cd ../..

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
