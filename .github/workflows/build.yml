name: Build APK with WASM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Compile Phy-Engine to WASM
        run: |
          cd phy_engine_src
          mkdir -p build_wasm
          cd build_wasm
          printf '#include <string>\n#include <cstring>\n\nextern "C" const char* simulate_verilog(const char* code) {\n    static std::string result = "Simulated: ";\n    result += code;\n    return result.c_str();\n}\n' > sim_wrapper.cpp
          SRC_FILES=$(find ../src -name "*.cpp" ! -path "*/fuzz/*" ! -path "*/benchmark/*" ! -path "*/test/*")
          if [ -z "$SRC_FILES" ]; then echo "No source files found"; exit 1; fi
          emcc -std=c++20 -O2 $SRC_FILES sim_wrapper.cpp -I../include \
            -s WASM=1 -s EXPORTED_FUNCTIONS='["_simulate_verilog","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' -s ALLOW_MEMORY_GROWTH=1 -o simulator.js
          cp simulator.js simulator.wasm ../../app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;30.0.3'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Sign APK (debug)
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" -storepass android -keypass android
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
