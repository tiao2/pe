name: Build APK with WASM (Custom)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Compile Phy-Engine to WASM
        run: |
          cd phy_engine_src
          em++ -std=c++23 -O3 \
            -Iinclude \
            src/dll_main.cpp simulate_wrapper.cpp \
            -fexceptions -s DISABLE_EXCEPTION_CATCHING=0 \
            -s WASM=1 -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT=web \
            -s ALLOW_MEMORY_GROWTH=1 -s FILESYSTEM=0 \
            -s EXPORTED_RUNTIME_METHODS='["cwrap","stringToUTF8","UTF8ToString"]' \
            -s EXPORTED_FUNCTIONS='["_malloc","_free","_simulate_verilog"]' \
            -o simulator.js
          mkdir -p ../app/src/main/assets
          cp simulator.js simulator.wasm ../app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;30.0.3'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Add build-tools to PATH for signing
        run: echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH

      - name: Sign APK (debug)
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" -storepass android -keypass android
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android app/build/outputs/apk/release/*.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk