<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verilog Simulator</title>
    <script src="simulator.js"></script>
    <style>
        textarea { width: 100%; height: 300px; font-family: monospace; }
        button { margin-top: 10px; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
</head>
<body>
    <h3>Verilog Simulator (Phy-Engine WASM)</h3>
    <textarea id="code" placeholder="Enter Verilog code...">
module top(input a, output y);
  assign y = a;
endmodule
    </textarea>
    <br>
    <button onclick="run()">Run</button>
    <h4>Output:</h4>
    <pre id="output"></pre>
    <script>
        let simulateFunc = null;
        Module.onRuntimeInitialized = () => {
            simulateFunc = Module.cwrap('simulate_verilog', 'string', ['string']);
        };
        function run() {
            const code = document.getElementById('code').value;
            if (simulateFunc) {
                const result = simulateFunc(code);
                document.getElementById('output').innerText = result;
            } else {
                document.getElementById('output').innerText = 'WASM not ready yet.';
            }
        }
    </script>
</body>
</html>
